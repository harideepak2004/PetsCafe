<!doctype html>
<html><body style="margin:0;padding:24px;background:#fbf6f0;font-family:Arial,Helvetica,sans-serif;color:#2b1d14">
<table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden">
  <tr><td style="background:#7a4a2a;color:#fff;padding:20px 24px">
    <div style="font-size:13px;opacity:.85">Pets Cafe · Order #{{ order.pk }}</div>
    <div style="font-size:22px;font-weight:bold">{{ headline }}</div>
  </td></tr>
  <tr><td style="padding:24px;font-size:14px">
    <p style="margin:0 0 14px">{{ order.get_order_type_display }}{% if order.table_number %} · Table {{ order.table_number }}{% endif %}</p>
    <table role="presentation" width="100%" style="border-collapse:collapse">
      {% for item in items %}
      <tr><td style="padding:6px 0">{{ item.quantity }} × {{ item.name }}</td><td align="right">&#8377;{{ item.line_total }}</td></tr>
      {% endfor %}
      <tr><td style="padding:12px 0 0;border-top:1px solid #eee;font-weight:bold">Total</td>
          <td align="right" style="padding:12px 0 0;border-top:1px solid #eee;font-weight:bold;font-size:18px">&#8377;{{ order.total }}</td></tr>
    </table>
    <p style="margin:20px 0 0"><a href="{{ frontend_url }}/orders" style="display:inline-block;background:#7a4a2a;color:#fff;text-decoration:none;padding:11px 18px;border-radius:8px;font-weight:bold">Track my order</a></p>
  </td></tr>
</table></body></html>
