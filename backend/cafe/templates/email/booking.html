<!doctype html>
<html><body style="margin:0;padding:24px;background:#fbf6f0;font-family:Arial,Helvetica,sans-serif;color:#2b1d14">
<table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden">
  <tr><td style="background:#7a4a2a;color:#fff;padding:20px 24px">
    <div style="font-size:13px;opacity:.85">Pets Cafe</div>
    <div style="font-size:22px;font-weight:bold">See you on {{ booking.date|date:"D, d M" }} at {{ slot }}!</div>
  </td></tr>
  <tr><td style="padding:24px;font-size:14px">
    <p style="margin:0 0 8px">Table for <strong>{{ booking.guests }}</strong> · {{ booking.get_pet_preference_display }}</p>
    <p style="margin:0 0 20px;color:#6b5a4e">Your visit is one hour. Please arrive on time so the pets get their rest breaks too.</p>
    <a href="{{ frontend_url }}/bookings" style="display:inline-block;background:#7a4a2a;color:#fff;text-decoration:none;padding:11px 18px;border-radius:8px;font-weight:bold">Manage my booking</a>
  </td></tr>
</table></body></html>
