{% load static %}

<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="{% static 'css\Res style.css' %}">
    <link rel="icon" type="image/avif" href="{% static 'images/Cafe.avif' %}">
    <meta name="viewport" content="width-device-width,initial-scale=1.0" >
     <title>Pets Cafe</title>
    <style>
    .page-wrapper {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgb(244, 193, 149);
    font-family: Arial, Helvetica, sans-serif;
}

.login-box {
    background: #ffffff74;
    border: 2px solid #000;
    padding: 40px 50px;
    text-align: center;
    border-radius: 10px;
    width: 350px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

.login-box h1 {
    margin-bottom: 25px;
}

.login-box input[type="text"],
.login-box input[type="password"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 18px;
    background: #ffffff74;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.login-box input[type="submit"] {
    background-color: #b56b35;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s ease;
}

.login-box input[type="submit"]:hover{
    background-color: #8c4e22;
}

#alert {
    margin-top: 15px;
    color: red;
    font-weight: bold;
}

    </style>
</head>
<body>

<div class="page-wrapper">
    <form action="{% url 'login' %}" method="post">
        <div class="login-box">

            {% csrf_token %}
            <h1>LOG IN</h1>

            <input type="text" name="username" placeholder="Username">
            <input type="password" name="password" placeholder="Password">

            <input type="submit" name="submit" value="LOGIN">

            {% for message in messages %}
            <p id="alert">{{ message }}</p>
            {% endfor %}

        </div>
    </form>
</div>

</body>
</html>
