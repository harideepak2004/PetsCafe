{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu Submission Successful</title>
    <link rel="stylesheet" href="{% static 'css/menu_success.css' %}">
    <link rel="icon" type="image/avif" href="{% static 'images/Cafe.avif' %}">
</head>
<style>/* Body Styling */
body {
    background: #fff8f0; /* Soft cream background */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    color: #3e2f25; /* Dark brown text */
}

/* Heading */
h1 {
    font-size: 2.5rem;
    margin-bottom: 30px;
    color: #7b4e2f; /* Warm coffee brown */
}

/* Buttons */
button {
    background-color: #f08c00; /* Orange-brown */
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 25px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    background-color: #d97f00; /* Darker shade on hover */
    transform: scale(1.05);
    box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
}

/* Links wrapping buttons */
a {
    text-decoration: none;
    margin-top: 15px;
}
</style>
<body>
    <h1>✅ Your menu item has been submitted successfully!</h1>
    <a href="{% url 'index' %}"><button>Go Back to home</button></a>
</body>
</html>
